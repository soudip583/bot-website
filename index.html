<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVER MD BOT | ROOT ACCESS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New',monospace}
body{background:#000;color:#00ff41;text-align:center;overflow-x:hidden;cursor:none}
canvas#matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;opacity:0.18}
.cursor{position:fixed;width:20px;height:20px;border:1px solid #00ff41;border-radius:50%;pointer-events:none;z-index:9999;box-shadow:0 0 10px #00ff41;transition:0.1s}
.cursor-trail{position:fixed;width:6px;height:6px;background:#00ff41;border-radius:50%;pointer-events:none;z-index:9998;opacity:0.6}
/* Glitch */
.glitch{position:relative;font-size:44px;font-weight:900;letter-spacing:3px;text-shadow:0 0 10px #00ff41;animation:glitch-anim 2s infinite}
.glitch:before,.glitch:after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%;clip:rect(0,900px,0,0)}
.glitch:before{left:-2px;text-shadow:2px 0 #ff00ff;animation:glitch-anim 3s infinite linear alternate-reverse}
.glitch:after{left:2px;text-shadow:-2px 0 #00ffff;animation:glitch-anim 2s infinite linear alternate-reverse}
@keyframes glitch-anim{0%{clip:rect(10px,9999px,20px,0)}20%{clip:rect(80px,9999px,90px,0)}100%{clip:rect(10px,9999px,20px,0)}}
.typing
